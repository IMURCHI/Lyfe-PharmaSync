<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaSync - Account Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Professional CSS Architecture */
        :root {
            --bg-body: #7a7a7a;
            --bg-surface: #ffffff;
            --bg-sidebar: #f0f5f9;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* Layout */
        .modal { display: flex; width: 900px; height: 700px; background: var(--bg-surface); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
        
        /* Sidebar */
        aside { width: 250px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .logo { padding: 25px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text-main); }
        .logo i { background: var(--primary); color: white; padding: 8px; border-radius: 8px; font-size: 14px; }
        nav { flex: 1; padding: 10px 0; }
        .nav-item { display: flex; padding: 12px 20px; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text-main); background: var(--border); border-left: 3px solid var(--primary); cursor: default; }
        .nav-item i { color: var(--text-muted); margin-top: 2px; }
        .btn-logout { padding: 20px; font-weight: 600; color: var(--danger); border-top: 1px solid var(--border); background: none; border-left: none; border-right: none; border-bottom: none; cursor: pointer; text-align: left; }
        .btn-logout:hover { background: #fee2e2; }

        /* Main Content */
        main { flex: 1; display: flex; flex-direction: column; }
        .content { padding: 40px; overflow-y: auto; flex: 1; }
        h1 { font-size: 22px; color: var(--text-main); padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        h3 { font-size: 16px; margin: 30px 0 15px; color: var(--text-main); }
        hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
        
        /* Forms & Inputs */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        input[readonly] { background: #f8fafc; color: #94a3b8; }
        .input-row { display: flex; gap: 10px; }
        .helper-text { font-size: 12px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 5px; }

        /* UI Buttons */
        .btn { padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; border: none; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-ghost { background: transparent; color: var(--text-muted); }
        .btn-ghost:hover { background: #f1f5f9; color: var(--text-main); }
        .btn-outline-danger { background: white; border: 1px solid #fca5a5; color: var(--danger); }
        .btn-outline-danger:hover { background: #fef2f2; border-color: #ef4444; }

        /* Footer */
        footer { padding: 20px 40px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .success-text { color: #16a34a; }
    </style>
</head>
<body>

<div class="modal">
    <!-- SIDEBAR -->
    <aside>
        <div class="logo"><i class="fa-solid fa-heart-pulse"></i> PharmaSync</div>
        <nav><div class="nav-item"><i class="fa-regular fa-user"></i> My account</div></nav>
        <button id="btn-logout" class="btn-logout">Log out</button>
    </aside>

    <!-- MAIN CONTENT -->
    <main>
        <div class="content">
            <h1>My account</h1>
            
            <h3>Personal info</h3>
            <div class="form-group"><label>First name</label><input type="text" id="inp-fname" value="Jane"></div>
            <div class="form-group"><label>Last name</label><input type="text" id="inp-lname" value="Doe"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="inp-email" value="jane.doe@pharmasync.com">
                <div class="helper-text"><i class="fa-solid fa-circle-info"></i> Update your contact email address here.</div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-row">
                    <input type="password" value="****************" readonly>
                    <button id="btn-reset-pw" class="btn btn-outline-danger">Reset password</button>
                </div>
            </div>

            <hr>
            <h3>Reset settings</h3>
            <div class="helper-text" style="margin-bottom: 15px;"><i class="fa-solid fa-circle-exclamation"></i> Reverts account to factory state.</div>
            <button id="btn-factory" class="btn btn-outline-danger">Reset settings</button>

            <hr>
            <h3>Delete account</h3>
            <div class="helper-text"><i class="fa-solid fa-circle-exclamation"></i> Deleting your account revokes PharmaSync access.</div>
        </div>

        <!-- FOOTER -->
        <footer>
            <div id="status-text" class="status">Unsaved changes</div>
            <div style="display: flex; gap: 10px;">
                <button id="btn-cancel" class="btn btn-ghost">Cancel</button>
                <button id="btn-save" class="btn btn-primary">Save changes</button>
            </div>
        </footer>
    </main>
</div>

</body>
</html>
